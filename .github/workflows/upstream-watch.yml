name: upstream-watch
# Weekly: open (or update) an issue when firstmate changes the files our agent principles are adapted from.
on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 tools/upstream_check.py > report.txt
          code=$?
          cat report.txt
          if [ "$code" = "10" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Open or update issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream firstmate has changes worth reviewing"
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body=$(printf 'The watched firstmate files changed. Ask your agent: "review firstmate updates" (see docs/UPSTREAM.md).\n\n```\n%s\n```' "$(cat report.txt)")
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
